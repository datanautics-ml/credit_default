name: CD

on:
  push:
    branches: [ main, master ]
    paths:
      - 'flows/**'
      - 'src/**'
      - 'requirements.txt'
  workflow_dispatch:
    inputs:
      train_model:
        description: 'Train new model'
        required: false
        default: true
        type: boolean
  schedule:
    # Run weekly on Monday at 2 AM UTC
    - cron: '0 2 * * 1'

jobs:
  train-model:
    name: Train ML Model
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Create required directories
      run: |
        mkdir -p data/processed models logs mlruns

    - name: Start MLflow tracking server
      run: |
        mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow.db --default-artifact-root ./mlruns &
        sleep 5
      continue-on-error: true

    - name: Set environment variables
      run: |
        echo "MLFLOW_TRACKING_URI=http://localhost:5000" >> $GITHUB_ENV
        echo "MLFLOW_EXPERIMENT_NAME=credit_default_prediction" >> $GITHUB_ENV
        echo "PREFECT_API_URL=http://localhost:4200/api" >> $GITHUB_ENV

    - name: Check if training data exists
      id: check_data
      run: |
        if [ -f "data/processed/data_01.csv" ]; then
          echo "data_exists=true" >> $GITHUB_OUTPUT
          echo "Training data found"
        else
          echo "data_exists=false" >> $GITHUB_OUTPUT
          echo "Warning: Training data not found. Skipping model training."
        fi

    - name: Train model (if data exists)
      if: steps.check_data.outputs.data_exists == 'true'
      run: |
        python -m flows.train_flow
      continue-on-error: true

    - name: Upload model artifacts
      if: always() && steps.check_data.outputs.data_exists == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: trained-models
        path: |
          models/*.joblib
          models/*.json
          mlflow.db
        retention-days: 30
      continue-on-error: true

    - name: Upload training logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: training-logs
        path: logs/
        retention-days: 7
      continue-on-error: true

  deploy-model:
    name: Deploy Model
    runs-on: ubuntu-latest
    needs: [train-model]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    environment:
      name: production
      url: https://deployment-url.com
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download model artifacts
      uses: actions/download-artifact@v4
      with:
        name: trained-models
        path: models/
      continue-on-error: true

    - name: Deploy model
      run: |
        echo "Model deployment step"
        echo "Add deployment logic here (e.g., upload to model registry, deploy to cloud, etc.)"
      continue-on-error: true
