[tool.black]
line-length = 127
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | env
  | _build
  | buck-out
  | build
  | dist
  | mlruns
  | mlflow.db
)/
'''

[tool.isort]
profile = "black"
line_length = 127
skip = [".venv", "venv", "env", "mlruns", "mlflow.db", "__pycache__", ".mypy_cache"]
known_first_party = ["src"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = [
    "mlruns/",
    "mlflow.db",
    "build/",
    "dist/",
    ".venv/",
    "venv/",
    "env/"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=src --cov=flows --cov-report=xml --cov-report=html --cov-report=term-missing"
